name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      registry: ${{ steps.scope.outputs.registry }}
      mise: ${{ steps.scope.outputs.mise }}
      build_audit: ${{ steps.scope.outputs.build_audit }}
    steps:
      - name: Checkout exact validation tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test validation policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_ci_scope.py' -v
      - name: Select and validate scope from the actual diff
        id: scope
        run: python3 scripts/ci_scope.py

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: quality
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install and smoke-test changed mise tool pins
        if: needs.scope.outputs.mise == 'true'
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tool-pins
        run: |
          mise="$RUNNER_TEMP/mise-pin-check"
          curl --fail --silent --show-error --location \
            https://github.com/jdx/mise/releases/download/v2026.10.8/mise-v2026.10.8-linux-x64 \
            --output "$mise"
          printf '%s  %s\n' c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428 "$mise" | sha256sum --check
          chmod 755 "$mise"
          "$mise" trust mise.toml
          "$mise" install
          "$mise" exec -- go version
          "$mise" exec -- python3 --version
          "$mise" exec -- shellcheck --version
          "$mise" exec -- gh --version
      - name: Check formatting
        run: make format-check
      - name: Check module consistency and vet
        run: make module-check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: Validate workflow syntax
        run: make workflows
      - name: Validate documentation links
        run: make docs

  tests:
    name: Tests
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: tests
      - name: Run race tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Write coverage summary
        shell: bash
        run: |
          {
            echo '## Go coverage'
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  vulnerabilities:
    name: Vulnerabilities
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          profile: vulnerabilities
      - name: Run govulncheck
        run: make vulnerability

  dependency-review:
    name: Dependency review
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never

  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  container:
    name: Container (${{ matrix.architecture }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      SMOKE_EVIDENCE_PATH: sab-smoke/${{ matrix.architecture }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Go for runtime fixtures
        uses: ./.github/actions/setup-go
        with:
          profile: runtime
      - name: Provision rootless engine prerequisites
        run: sh scripts/setup-rootless-ci.sh
      - name: Validate deployment recipes
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f examples/docker-compose.rootless.yml config --quiet
          mkdir -p /tmp/sab-quadlet-source /tmp/sab-quadlet-generated
          cp examples/sonarr-anime-bridge.container /tmp/sab-quadlet-source/
          QUADLET_UNIT_DIRS=/tmp/sab-quadlet-source /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun
      - name: Build candidate once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: sonarr-anime-bridge:ci
          build-args: VERSION=ci
          cache-from: type=gha,scope=ci-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.architecture }}
      - name: Build shared runtime fixture
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/runtime-fixture" ./testdata/runtime-fixture
      - name: Smoke-test the candidate
        run: |
          test "$(docker image inspect sonarr-anime-bridge:ci --format '{{.Config.User}}')" = 65532
          test "$(docker run --rm sonarr-anime-bridge:ci --version)" = ci
          sh testdata/runtime-smoke.sh --fixture "$RUNNER_TEMP/runtime-fixture" --output "$RUNNER_TEMP/$SMOKE_EVIDENCE_PATH/docker" sonarr-anime-bridge:ci
      - name: Test the same candidate bytes under both rootless engines
        run: |
          docker image inspect sonarr-anime-bridge:ci > /tmp/sab-candidate.json
          docker save --output /tmp/sab-candidate.tar sonarr-anime-bridge:ci
          export SAB_SMOKE_FIXTURE="$RUNNER_TEMP/runtime-fixture"
          SAB_SMOKE_OUTPUT="$RUNNER_TEMP/$SMOKE_EVIDENCE_PATH/rootless-docker" sh testdata/rootless-smoke.sh docker sonarr-anime-bridge:ci /tmp/sab-candidate.tar /tmp/sab-candidate.json &
          docker_pid=$!
          SAB_SMOKE_OUTPUT="$RUNNER_TEMP/$SMOKE_EVIDENCE_PATH/rootless-podman" sh testdata/rootless-smoke.sh podman sonarr-anime-bridge:ci /tmp/sab-candidate.tar /tmp/sab-candidate.json &
          podman_pid=$!
          # Wait for both evidence sets, even when the first engine fails.
          docker_status=0
          podman_status=0
          wait "$docker_pid" || docker_status=$?
          wait "$podman_pid" || podman_status=$?
          echo "Rootless results: docker=$docker_status podman=$podman_status"
          test "$docker_status" -eq 0 && test "$podman_status" -eq 0
      - name: Retain sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-runtime-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.SMOKE_EVIDENCE_PATH }}/*/*.log
            ${{ runner.temp }}/${{ env.SMOKE_EVIDENCE_PATH }}/*/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Audit context and retained-builder compilation
        if: needs.scope.outputs.build_audit == 'true'
        run: sh testdata/container-build-audit.sh
      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sonarr-anime-bridge:ci
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Test digest-preserving publication in a disposable registry
        if: matrix.architecture == 'amd64' && needs.scope.outputs.registry == 'true'
        run: sh testdata/release-registry.sh

  required:
    name: Required
    if: always()
    needs: [scope, quality, tests, vulnerabilities, dependency-review, codeql, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Aggregate required checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py required
