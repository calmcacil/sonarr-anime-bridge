name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check formatting
        run: make format-check
      - name: Check module consistency and vet
        run: make module-check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Validate workflow syntax
        run: make workflows
      - name: Validate documentation links
        run: make docs
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commits, for example 'feat(api): add filter' or 'feat!: breaking change'."
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Write coverage summary
        shell: bash
        run: |
          {
            echo '## Go coverage'
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  builds:
    name: Supported builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build supported Go targets
        run: make build
      - name: Build and smoke-test Linux amd64 image
        run: |
          docker build --platform=linux/amd64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 \
            --build-arg VERSION=ci -t sonarr-anime-bridge:ci-amd64 .
          test "$(docker run --rm sonarr-anime-bridge:ci-amd64 --version)" = ci
          sh testdata/runtime-smoke.sh sonarr-anime-bridge:ci-amd64
      - name: Build Linux arm64 image
        run: |
          docker build --platform=linux/arm64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=arm64 \
            --build-arg VERSION=ci -t sonarr-anime-bridge:ci-arm64 .

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: make vulnerability

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (Go)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:go

  container:
    name: Container vulnerabilities
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image for scanning
        run: |
          docker build --platform=linux/amd64 \
            --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 \
            --build-arg VERSION=ci -t sonarr-anime-bridge:ci .
      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sonarr-anime-bridge:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  required:
    name: Required
    if: always()
    needs: [quality, tests, builds, vulnerabilities, dependency-review, codeql, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate required checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILDS_RESULT: ${{ needs.builds.result }}
          VULNERABILITIES_RESULT: ${{ needs.vulnerabilities.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$RESULTS"
          if [ "${#results[@]}" -ne 7 ]; then
            echo "Required checks are missing: $RESULTS"
            exit 1
          fi
          for result in "$QUALITY_RESULT" "$TESTS_RESULT" "$BUILDS_RESULT" "$VULNERABILITIES_RESULT" "$CODEQL_RESULT" "$CONTAINER_RESULT"; do
            if [ "$result" != success ]; then
              echo "One or more required jobs did not succeed: $RESULTS"
              exit 1
            fi
          done
          if [ "$DEPENDENCY_REVIEW_RESULT" = skipped ] && [ "$EVENT_NAME" != pull_request ]; then
            echo "Dependency review deliberately skipped for $EVENT_NAME"
          elif [ "$DEPENDENCY_REVIEW_RESULT" != success ]; then
            echo "Dependency review has an unexpected result: $DEPENDENCY_REVIEW_RESULT"
            exit 1
          fi
