name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'specs/**'
      - 'testdata/**'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changed.outputs.go }}
      container: ${{ steps.changed.outputs.container }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changed paths
        id: changed
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            container:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: golangci-lint,go-build,go-test

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image (smoke)
        run: |
          docker build \
            --platform=linux/amd64 \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            -t sonarr-anime-bridge:ci-smoke .

  check:
    needs:
      - changes
      - hygiene
      - go
      - docker-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate required check
        run: |
          if [ "${{ needs.changes.result }}" = "failure" ] ||
             [ "${{ needs.changes.result }}" = "cancelled" ] ||
             [ "${{ needs.hygiene.result }}" = "failure" ] ||
             [ "${{ needs.hygiene.result }}" = "cancelled" ] ||
             [ "${{ needs.go.result }}" = "failure" ] ||
             [ "${{ needs.go.result }}" = "cancelled" ] ||
             [ "${{ needs.docker-smoke.result }}" = "failure" ] ||
             [ "${{ needs.docker-smoke.result }}" = "cancelled" ]; then
            echo "One or more checks failed"
            exit 1
          fi
