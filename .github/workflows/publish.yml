name: Publish release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to recover (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Serialize shared alias writes without replacing pending release runs.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify released source
    if: >-
      github.repository == 'calmcacil/sonarr-anime-bridge' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_commit: ${{ steps.source.outputs.commit }}
      immutable_exists: ${{ steps.existing.outputs.exists }}
      immutable_digest: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Check out trusted automation separately from released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Resolve and validate published release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .automation/scripts/release_image.py release
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag source is merged to main
        id: source
        working-directory: release-source
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR for read-only verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate an existing immutable image
        id: existing
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 .automation/scripts/release_image.py existing --image "$IMAGE" --tag "$TAG" --revision "$SOURCE_COMMIT"

  candidate:
    name: Build or reuse exact candidate
    needs: verify
    if: github.repository == 'calmcacil/sonarr-anime-bridge' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    steps:
      - name: Check out the verified source commit
        if: needs.verify.outputs.immutable_exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_commit }}
          path: release-source
          persist-credentials: false
      - name: Confirm source has not changed
        if: needs.verify.outputs.immutable_exists != 'true'
        working-directory: release-source
        env:
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Set up Docker Buildx (cross-compilation does not need QEMU)
        if: needs.verify.outputs.immutable_exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: needs.verify.outputs.immutable_exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build multi-platform candidate without public release tags
        if: needs.verify.outputs.immutable_exists != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.tag }}
            org.opencontainers.image.title=sonarr-anime-bridge
            org.opencontainers.image.description=Sonarr-compatible seasonal anime lists from AniList
            org.opencontainers.image.licenses=MIT
          build-args: VERSION=${{ needs.verify.outputs.tag }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true
      - name: Freeze candidate digest
        id: result
        env:
          EXISTING: ${{ needs.verify.outputs.immutable_exists }}
          EXISTING_DIGEST: ${{ needs.verify.outputs.immutable_digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$EXISTING" = true ]; then digest="$EXISTING_DIGEST"; else digest="$BUILD_DIGEST"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate published candidate (${{ matrix.architecture }})
    needs: [verify, candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out trusted validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Log in to GHCR for read-only validation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify exact index, source labels, runtime config, and attestations
        id: platform
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 .automation/scripts/release_image.py validate --image "$IMAGE" \
            --tag "$TAG" --revision "$SOURCE_COMMIT" --digest "$DIGEST" --architecture "$ARCHITECTURE"
      - name: Smoke-test the actual platform digest on a native runner
        env:
          PLATFORM_REF: ${{ steps.platform.outputs.platform_ref }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          docker pull "$PLATFORM_REF"
          test "$(docker run --rm "$PLATFORM_REF" --version)" = "$TAG"
          sh .automation/testdata/runtime-smoke.sh "$PLATFORM_REF"
      - name: Scan the actual platform digest before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.platform.outputs.platform_ref }}
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  promote:
    name: Promote validated release digest
    needs: [verify, candidate, validate]
    if: >-
      github.repository == 'calmcacil/sonarr-anime-bridge' &&
      needs.verify.result == 'success' && needs.candidate.result == 'success' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted promotion tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote unchanged index to immutable tag and eligible aliases
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .automation/scripts/release_image.py promote --image "$IMAGE" \
            --tag "$TAG" --revision "$SOURCE_COMMIT" --digest "$DIGEST"
