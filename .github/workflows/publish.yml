name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'specs/**'
      - '.github/**'
      - '**/*_test.go'
      - 'internal/testutil/**'
      - 'testdata/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump: auto, patch, minor, major'
        required: false
        default: auto

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.svu.outputs.tag || steps.pushed-tag.outputs.tag }}
      skip: ${{ steps.code-check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for relevant code changes
        id: code-check
        if: github.ref_type != 'tag'
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CHANGED=$(git diff --name-only "$BASE"..HEAD 2>/dev/null || echo "")
          SKIP_PATTERNS='\\.md$|^docs/|^specs/|^\\.github/|_test\\.go$|^internal/testutil/|^testdata/|^LICENSE$|^NOTICE$'
          CODE_CHANGES=$(echo "$CHANGED" | grep -vE "$SKIP_PATTERNS" || true)
          if [ -z "$CODE_CHANGES" ]; then
            echo "No relevant code changes since $BASE. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use pushed tag
        if: github.ref_type == 'tag'
        id: pushed-tag
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: github.ref_type != 'tag' && steps.code-check.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Install svu
        if: github.ref_type != 'tag' && steps.code-check.outputs.skip != 'true'
        run: go install github.com/caarlos0/svu@v1.12.0

      - name: Determine version
        if: github.ref_type != 'tag' && steps.code-check.outputs.skip != 'true'
        id: svu
        run: |
          BUMP="${{ inputs.version_bump || 'auto' }}"
          if [ "$BUMP" = "auto" ]; then
            TAG=$(svu next)
          else
            TAG=$(svu "$BUMP")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  release:
    needs: [version]
    if: github.ref_type != 'tag' && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update CHANGELOG
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          [ "$LAST" = "$TAG" ] && echo "No new version, skipping" && exit 0

          VERSION="${TAG#v}"
          DATE=$(date +%Y-%m-%d)

          ENTRY=$(mktemp)
          {
            echo ""
            echo "## [$VERSION] — $DATE"
            echo ""

            for group in feat fix perf refactor docs test chore ci; do
              case "$group" in
                feat) LABEL="Added" ;;
                fix)  LABEL="Fixed" ;;
                perf|refactor|ci) LABEL="Changed" ;;
                docs) LABEL="Documentation" ;;
                test) LABEL="Testing" ;;
                chore) LABEL="Miscellaneous" ;;
              esac
              COMMITS=$(git log "${LAST}..HEAD" --oneline --format="%s" 2>/dev/null \
                | grep -iE "^$group(\\(.*\\))?:" || true)
              if [ -n "$COMMITS" ]; then
                echo "### $LABEL"
                echo "$COMMITS" | sed -E "s/^$group(\\(.*\\))?: *//i; s/ *\\[skip ci\\]//; s/ *\\[ci skip\\]//"
                echo ""
              fi
            done
          } > "$ENTRY"

          awk '
            /^## / && !inserted { system("cat '"$ENTRY"'"); inserted=1 }
            { print }
            END { if (!inserted) system("cat '"$ENTRY"'") }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          echo "[$VERSION]: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> CHANGELOG.md

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for $TAG [skip ci]" || true

      - name: Push CHANGELOG and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git push origin HEAD:main
          RELEASE_SHA=$(git rev-parse HEAD)
          git tag "$TAG" || true
          git push origin "$TAG"
          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --generate-notes || true

  docker:
    needs: [version, release]
    if: always() && needs.version.outputs.skip != 'true' && (github.ref_type == 'tag' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version components
        id: version-parts
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if [ -n "$TAG" ]; then
            echo "full=$TAG" >> "$GITHUB_OUTPUT"
            echo "major=$(echo "$TAG" | sed 's/\\(v[0-9]*\\).*/\\1/')" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$TAG" | sed 's/\\(v[0-9]*\\.[0-9]*\\).*/\\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=${{ steps.version-parts.outputs.full }},enable=${{ steps.version-parts.outputs.full != '' }}
            type=raw,value=${{ steps.version-parts.outputs.major }},enable=${{ steps.version-parts.outputs.major != '' }}
            type=raw,value=${{ steps.version-parts.outputs.minor }},enable=${{ steps.version-parts.outputs.minor != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.tag }}
          cache-from: |
            type=gha,scope=sonarr-anime-bridge-docker-main
            type=gha,scope=sonarr-anime-bridge-docker-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=sonarr-anime-bridge-docker-${{ github.ref_name }}
