services:
  sonarr-seasonal:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - "${APPDATA_DIR:-./appdata/sonarr-anime-bridge}:/data"
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # environment:
    #   PREWARM_YEARS: "2026"
    #   LOG_LEVEL: debug
